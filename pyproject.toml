[build-system]
# hatchling >=1.27 for PEP 639 (`license` as an SPDX expression +
# `license-files`); hatch-vcs derives the version from the git tag — see the
# tool.hatch.version table below. This replaced setuptools carrying a pinned
# version string in the project table: the fleet pattern (willow-mcp,
# kartikeya, jeles), adopted here after kartikeya's v0.0.8 shipped a tag that
# built a different version and only PyPI's duplicate-upload refusal noticed.
#
# No bracketed table name appears in the comments of this file. Not style:
# tests/test_version.py reads it as text, splitting on the first literal
# `[name]`, so a table named in prose above its own header silently becomes the
# thing the tests read. That is the same class of trap as the License-classifier
# comment further down, which an earlier check matched instead of the list.
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nestor-meaning"
# The git tag is the single source of truth — see the tool.hatch.version table
# below. Nothing in this tree carries a version to drift from it, which is what
# tests/test_version.py::test_the_version_is_written_once now enforces.
dynamic = ["version"]
description = "Has a human checked this? A seal/serve/audit mechanic over a verified-match memory — translation, entity resolution and numeric reconciliation recipes, a hash-chained ledger, injected storage, and browser, terminal and MCP surfaces."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "audit", "provenance", "human-in-the-loop", "verification",
    "translation-memory", "entity-resolution", "reconciliation",
    "hash-chain", "ai-governance",
]
# No `License ::` classifier: with a PEP 639 license expression above, setuptools
# rejects one rather than reconciling two sources for the same fact.
#
# The Python rows match `requires-python`. Two of the four are covered by
# interpolation rather than by a run: tests.yml deliberately tests floor and
# current (3.10 and 3.12), so 3.11 and 3.13 are asserted here and exercised
# nowhere. That is a defensible matrix and an undefensible silence, so it is
# written down in docs/releasing.md rather than left for a bug report.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/rudi193-cmd/Nestor"
Repository = "https://github.com/rudi193-cmd/Nestor"
Changelog = "https://github.com/rudi193-cmd/Nestor/blob/master/CHANGELOG.md"
Issues = "https://github.com/rudi193-cmd/Nestor/issues"
"Release runbook" = "https://github.com/rudi193-cmd/Nestor/blob/master/docs/releasing.md"

[project.scripts]
nestor = "nestor.cli:main"
nestor-ui = "nestor.ui:main"

[project.optional-dependencies]
keys = ["cryptography>=41"]
dev = [
    "pytest>=8.0",
    # what the Development section runs and CI enforces — a dev install that
    # cannot run the documented lint commands is the docs lying by omission
    "ruff==0.16.3",
    "bandit",
    # The fourth gate in scripts/ci-lint.sh (IDEAS §7.5). Unpinned like bandit —
    # nothing here is judged against a committed baseline the way ruff's rule
    # set or detect-secrets' findings are, so there is no version this gate
    # must agree with CI about.
    "mypy",
    # The third gate in scripts/ci-lint.sh. Decision 0101 wired the secret scan
    # into that script and tests.yml but not into this extra, so every venv built
    # from `.[dev]` — including the one the web SessionStart hook builds — passed
    # ruff and bandit and then died on `No module named detect_secrets` at the
    # gate nothing had reported on. Pinned to the version tests.yml installs:
    # the gate is judged against a committed .secrets.baseline, and a scanner
    # that finds a different set from CI's is a gate that disagrees with the one
    # branch protection actually runs.
    "detect-secrets==1.5.0",
    # The fifth gate in scripts/ci-lint.sh (IDEAS §7.5) — known CVEs in the
    # resolved dependency set. Unpinned like bandit and mypy: it is judged
    # against a live vulnerability database queried at run time, not a
    # version-pinned rule set or a committed baseline the way ruff and
    # detect-secrets are, so there is no version this gate must agree with CI
    # about. See scripts/dep-audit.sh for the invocation and its offline
    # handling.
    "pip-audit",
    "hypothesis",
]
cloud = [
    "anthropic>=0.60",
]
semantic = [
    "fastembed>=0.4",
]
# The optional cloud-path seam (nestor/cloud_seal.py): an agent provisionally
# seals through willow-gate, under its own identity, at its earned rung. The
# module fail-closes on import when the gate is absent — the rule is the gate
# must be present at BOTH ends (this end binds the agent; the home end confers
# canonical via custody.checkpoint()). willow-gate is a fleet sibling installed
# alongside; a bare install fails closed when it is not.
gate = [
    "willow-gate",
]
# Kept out of [dev] on purpose: CI's dev install would carry a build backend and
# an upload client it never uses, and a release toolchain is not a test
# dependency. `pip install -e ".[publish]"` is step 1 of docs/releasing.md.
publish = [
    "build>=1.2",
    "twine>=5.1",
]

[tool.pytest.ini_options]
# `bench` is not an installed package (only `nestor*` is, below), so it imports
# only when the repo root is on sys.path. `python -m pytest` puts it there and
# the bare `pytest` console script does not — so the same tree gave 344 tests
# one way and 339 plus a silent skip the other, and the five that vanished were
# the bench-coverage guards whose whole reason to live in this suite is that
# they must not be skippable. Pin the path so the invocation stops mattering.
pythonpath = ["."]

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; an off-tag build gets a `.devN+g<sha>` suffix, which PyPI refuses — so
# an accidental publish from an untagged commit fails loudly instead of shipping
# something mislabelled. Every CI checkout that builds must use `fetch-depth: 0`
# with tags, or no tag is present and the derived version is silently wrong.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["nestor"]
# Checked, not assumed: with `packages = ["nestor"]` alone, hatchling's
# default wheel packaging DOES already walk the whole nestor/ tree and pick
# up nestor/vendor/cytoscape.min.js and its LICENSE file — verified by
# building a real wheel with this force-include block removed and inspecting
# its contents. force-include is redundant against that default *today*, and
# is kept anyway as an explicit contract: "these two files ship, however
# hatchling's own default packaging behaves" survives a future hatchling
# default change or a stray exclude pattern that would otherwise silently
# ship a Graph tab whose script tag has nothing to inline. The actual guard
# is tests/test_packaging.py, which builds a real wheel and asserts both
# files are inside it — independent of whether this block or hatchling's
# default is what put them there.
[tool.hatch.build.targets.wheel.force-include]
"nestor/vendor/cytoscape.min.js" = "nestor/vendor/cytoscape.min.js"
"nestor/vendor/cytoscape.LICENSE" = "nestor/vendor/cytoscape.LICENSE"
"nestor/ui_pure.js" = "nestor/ui_pure.js"

[tool.hatch.build.targets.sdist]
# Named explicitly rather than left to the default, which is "everything not
# VCS-ignored" — that would put docs/agent-log.md and the dogfood store
# (hundreds of KB of session record) inside every sdist. A source distribution
# is the package plus what it takes to build and test it, and this repo keeps a
# great deal that is neither.
include = [
    "nestor/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
# nestor/vendor/ is a vendored third-party artifact (Cytoscape.js — see
# nestor/vendor/README.md), not project source. Ruff only lints .py/.pyi by
# extension so this is redundant against the vendored .js itself today, but
# it is documented here rather than left to that default: `ruff check nestor
# tests hooks` names a whole directory, and a future vendored file with a
# `.py`-shaped name (a stub, a shim) must not become part of the gated
# surface just by living next to this one.
extend-exclude = ["nestor/vendor"]

[tool.ruff.lint.per-file-ignores]
# Compact one-line test setup is house style; don't fight it.
"tests/*" = ["E702", "E741"]

[tool.mypy]
# The type-checking gate IDEAS §7.5 named as absent and "the cheapest of
# these to add" — wired into scripts/ci-lint.sh alongside ruff and bandit.
#
# Scoped to the `nestor` package, matching what ruff/bandit already treat as
# the gated surface for correctness (ruff also covers `tests` and `hooks`,
# but those are fixtures and CLI-agnostic shell glue, not the typed seam this
# gate exists for — see IDEAS §7.5).
#
# Baseline, not `--strict`, on purpose: this is meant to be a gate that
# passes today and tightens later, not one maximal on day one that fails on
# a backlog nobody asked for. `mypy nestor` with no config at all reported 35
# errors before this file existed; the four enabled below are the ones that
# caught real bugs during that first pass (a migration step typed `object`
# so it could not be called, SQL param lists whose declared type silently
# excluded the `int` limit/offset actually appended to them, a row indexed
# after a re-fetch that could return `None`) rather than noise, so they stay
# on rather than being the reason the gate was scoped down instead.
python_version = "3.10"
files = ["nestor"]
# Same rationale as [tool.ruff]'s extend-exclude just above: mypy only reads
# .py/.pyi by extension so this is belt-and-braces against today's vendored
# .js, documented for the same reason — a directory-scoped gate should not
# start covering a vendored file by accident of a future filename.
exclude = ["^nestor/vendor/"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Four optional integrations, each behind its own extra (`gate`, `semantic`,
# `cloud`, `keys`) and each fail-closed at import time when that extra is not
# installed — the cryptography imports in keyring.py/signing.py are lazy and
# guarded, raising a loud "install [keys]" rather than degrading silently. The
# lint job that runs `mypy nestor` installs ONLY the lint tools (ruff, bandit,
# mypy, detect-secrets) — not the package and not any extra — so NONE of these
# four is importable when the gate runs. Nestor's core is stdlib-only, so these
# are the *only* third-party imports mypy meets, and each must be ignored or the
# gate reports a missing stub for a dependency it deliberately does not carry.
# `[keys]`'s cryptography was the one this list first missed: a local `.[keys]`
# env resolved it and hid the gap until CI, where the lint job is keys-absent,
# turned red (agent-log §6.110). Requiring the extras would make the gate a
# proxy for "did every extra happen to be installed" rather than a check of
# nestor's own code. This ignores only the *import*; the rest of cloud_seal.py,
# semantic_matcher.py, engine.py, keyring.py and signing.py stays type-checked.
module = ["willow_gate", "willow_gate.*", "fastembed", "anthropic",
          "cryptography.*"]
ignore_missing_imports = true
# ...and the same when the extra IS installed. `ignore_missing_imports` only
# speaks to the absent case, so a dev env with an extra resolved sends mypy off
# into that dependency's own stubs — `.[semantic]` pulls fastembed, which pulls
# numpy, whose stubs use 3.12+ `type` statements and are a syntax error under
# the 3.10 `python_version` above. One error in numpy's own .pyi aborts the run
# before nestor is checked at all, so the gate went red locally while CI (lint
# tools only, no extras) stayed green.
#
# That is §6.110 in the mirror. There a local `.[keys]` env resolved an import
# and hid a gap until keys-absent CI turned red; here a local extra breaks a
# gate that CI passes. Both are the same defect — the verdict moving with which
# extras happen to be installed — and the fix is the same principle already
# stated above: this gate checks nestor's own code. Skipping the import makes
# these four `Any` whether present or absent, so local and CI agree by
# construction rather than by everyone's venv matching the lint job's.
#
# `python_version` stays at 3.10 deliberately: it is the `requires-python`
# floor and the low row of the test matrix, so the gate keeps catching code
# that would break on the oldest Python still supported. Raising it to satisfy
# numpy's stubs would trade a real check for a dependency we do not carry.
follow_imports = "skip"
