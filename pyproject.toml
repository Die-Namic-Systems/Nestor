[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nestor"
version = "0.1.0"
description = "Has a human checked this? A seal/serve/audit mechanic over a verified-match memory — translation, entity resolution and numeric reconciliation recipes, a hash-chained ledger, injected storage, and browser, terminal and MCP surfaces."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nestor = "nestor.cli:main"
nestor-ui = "nestor.ui:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
cloud = [
    "anthropic>=0.60",
]

[tool.setuptools.packages.find]
include = ["nestor*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Compact one-line test setup is house style; don't fight it.
"tests/*" = ["E702", "E741"]
