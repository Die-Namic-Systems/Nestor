name: Release Please

# Keeps an open "chore: release X.Y.Z" pull request that accumulates every merge
# to master — bumping the proposed version from conventional-commit prefixes and
# appending the CHANGELOG entry. Nothing publishes while it sits there. It arms
# auto-merge on itself, so when CI goes green it merges, the tag is created, and
# the tag push fires publish.yml.
#
# Before this, releasing meant editing `version` in pyproject.toml by hand,
# writing the CHANGELOG entry by hand, and pushing a tag by hand — three places
# to agree, checked by one guard in publish.yml at the very end. The version half
# of that is now gone entirely: hatch-vcs derives it from the tag, so the tag is
# the only thing that says what a release is (pyproject `[tool.hatch.version]`).
#
# WHY THE PAT, in both places below. This is the lesson jeles paid three releases
# to learn, and it fails silently every time:
#
#   1. GitHub suppresses workflow runs for any event generated with
#      GITHUB_TOKEN. Not just `push: tags` — `release: published` too. A
#      workflow waiting on either simply never runs, with no error anywhere.
#      jeles v0.2.0: tagged, released, absent from PyPI.
#   2. Calling publish.yml via `workflow_call` does start it, but then PyPI
#      authenticates against `job_workflow_ref` (the callee) while the PEP 740
#      attestation records `workflow_ref` (the caller). The two claims disagree
#      by construction and no publisher row reconciles them. jeles v0.2.1 and
#      v0.3.0: built fine, rejected at upload.
#   3. A PAT is not a bot token, so the tag it pushes triggers workflows
#      normally, and caller and callee are the same file.
#
#   The same applies to arming auto-merge: GitHub attributes an auto-merge to
#   whoever armed it, so armed with GITHUB_TOKEN the release PR would merge and
#   this workflow would never run again to cut the tag.
#
# SETUP — the willow-ci GitHub App (id 4749508) must be installed on this org
# with Contents: read/write and Pull requests: read/write, and the org must
# carry the variable WILLOW_CI_APP_ID and the secret WILLOW_CI_PRIVATE_KEY.
# The mint step below refuses to run without them rather than falling back to
# GITHUB_TOKEN, because that fallback produces a working-looking release PR and
# a publish that never happens. See docs/releasing.md.

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger.
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a run that may be cutting a release

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mints a short-lived installation token for the willow-ci GitHub App
      # (org variable WILLOW_CI_APP_ID + org secret WILLOW_CI_PRIVATE_KEY).
      #
      # GitHub suppresses workflow runs for events generated with GITHUB_TOKEN,
      # so a tag cut with it starts no release workflow and nothing reaches
      # PyPI — everything reads as fine. An App installation token is not
      # GITHUB_TOKEN, so its tag triggers workflows normally, exactly as the
      # PAT did. Unlike the PAT it is minted per run and expires in an hour;
      # its sibling ENGINE_PROPAGATION_TOKEN expired on 2026-08-04 and stopped
      # eleven repos receiving engine changes for three and a half weeks with
      # no signal.
      #
      # This step is also the guard: if the App is not installed or the key is
      # wrong it fails here and loudly, rather than degrading to GITHUB_TOKEN.
      - name: Mint a willow-ci installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          # The PAT, not the default GITHUB_TOKEN. checkout persists whatever
          # credential it used and later pushes reuse it; with the default, a
          # commit lands as github-actions[bot] and the release PR's CI comes
          # back `action_required` — held awaiting manual approval — so
          # auto-merge waits on a check that never reports.
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        id: release
        # Allowed to fail so the step below can say what went wrong. The step
        # below re-fails the job — nothing is being tolerated here, only
        # translated.
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Say what a failed release-please actually means
        # The step above checks the token EXISTS. Nothing checked that it
        # WORKS, and the two are different questions — the distinction this
        # repository keeps having to draw (§6.114's boot check; dep-audit.sh on
        # a skipped dependency; "silence from a check means nothing", 0127).
        #
        # Measured on 2026-08-23: eight consecutive runs failed, each after
        # ~5m40s of the action retrying, ending in a ~200-line octokit dump
        # whose one useful line was
        #
        #   POST /repos/OWNER/REPO/git/refs -> 403
        #   'Resource not accessible by personal access token'
        #   x-accepted-github-permissions: contents=write
        #
        # Creating the release PR's branch is a `git/refs` write, so a PAT
        # without Contents: write gets all the way to "Successfully found
        # branch HEAD sha" and dies at "Error when creating branch". Eight runs
        # went red before anybody read far enough to see which permission was
        # named. This does not fix the token — nothing in a commit can — it
        # makes the next one legible in the run summary rather than 200 lines
        # down.
        if: steps.release.outcome == 'failure'
        run: |
          echo "::error::release-please failed. The commonest cause by far is"
          echo "::error::the willow-ci App lacking a permission, NOT a bad commit."
          cat <<'MSG'

          The willow-ci App must be installed on this repository with:

              Contents:      read/write     <- creating the release branch needs this
              Pull requests: read/write     <- opening and updating the release PR

          An App that is merely INSTALLED passes the mint step and then fails
          here, because "exists" and "works" are different questions.

          Read the failing step's log and look for a 403 whose body says
          "Resource not accessible by personal access token". The response
          header `x-accepted-github-permissions` names the permission GitHub
          wanted — that is the one to add.

          Also check the PAT has not expired, and that its resource owner still
          covers this repository.

          Nothing was released, and nothing is lost: release-please reads commit
          history rather than events, so once the token is fixed the next push
          to the default branch picks up everything merged in the meantime.

          See docs/releasing.md and the SETUP note at the top of this file.
          MSG
          exit 1

      # Arm auto-merge, so a release ships when CI goes green rather than when
      # someone remembers the PR is open. Re-armed on every push to master,
      # which is also the self-heal: release-please rewrites the PR as commits
      # land, and this puts the arming back either way.
      #
      # This moves where the human gate sits. It used to be the tag push, which
      # an agent physically cannot do (session credentials carry `refs/heads/*`
      # and refuse `refs/tags/*` — four HTTP 403s while preparing v0.3.1, until a
      # human pushed it). release-please cuts the tag with the PAT and auto-merge
      # decides when, so the gate is now review of the feature PRs plus CI: the
      # suite on 3.10/3.12, ruff, bandit, detect-secrets, `twine check --strict`,
      # and publish.yml's install-the-wheel-and-import-it step. Deliberate, and
      # the same posture willow-mcp and kartikeya run.
      - name: Arm auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
                 --jq '[.[] | select(.headRefName | startswith("release-please--"))]
                       | first | .number // empty')
          if [ -z "$pr" ]; then
            echo "No open release PR — nothing releasable since the last tag."
            exit 0
          fi

          echo "Arming auto-merge on release PR #${pr}"
          if gh pr merge --auto --merge "$pr" --repo "$REPO"; then
            exit 0
          fi

          # Do not fall back to merging directly. `--auto` is what makes the
          # merge wait for CI; merging here instead would publish off an
          # unverified commit, and a PyPI version can never be reused or
          # replaced. Fail loudly and say what to fix.
          cat <<'MSG'
          ::error::Could not arm auto-merge on the release PR.

          Both of these must hold, and GitHub declines quietly otherwise:
            1. Settings -> General -> "Allow auto-merge" is enabled.
            2. The default branch's protection requires at least one status
               check. With no required check there is nothing for auto-merge
               to wait on, so GitHub will not arm it at all.

          Releases still work — the PR is there to merge by hand.
          MSG
          exit 1
