name: Publish

# This workflow publishes. It has done so twice — v0.3.0 and v0.3.1 — and the
# comment that used to live here ("nothing can publish today ... there are no
# tags, and `git tag -l` is empty") described a repository that no longer
# exists. Three things must be true for an upload, and the first is the gate:
#
#   1. a `v*` tag must exist, and pushing one is a human act — a session's git
#      credentials carry `refs/heads/*` and refuse `refs/tags/*` (HTTP 403), so
#      an agent can prepare an entire release and still not trigger it;
#   2. the `pypi` environment must exist in repo settings. A *required reviewer*
#      on it is deliberately not used: by the time a tag exists the PR has been
#      reviewed and merged and CI has run, so the prompt would ask the person
#      who pushed the tag to approve their own work. Add one only if a second
#      person should sign off — see docs/releasing.md;
#   3. Trusted Publishing must be configured on PyPI for this repo AND this
#      workflow filename — see docs/releasing.md.
#
# Without a tag, a run builds, checks and stops: `workflow_dispatch` is a dry
# run anybody can trigger, and the publish job is gated on the ref being a tag.

on:
  push:
    tags: ["v*"]
  # A dry run anybody can trigger: builds and checks, never uploads.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the release toolchain
        run: pip install -e ".[publish]"

      # The gate that matters. A tag saying v0.2.0 over a pyproject saying
      # 0.1.0 would upload a file whose name disagrees with the thing that was
      # tagged, and PyPI keeps it forever — a version number is the one claim
      # in a release nobody can correct afterwards.
      - name: Refuse a tag that disagrees with the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check the metadata PyPI will render
        run: python -m twine check --strict dist/*

      # Proof the artifact imports as itself, from the wheel rather than the
      # source tree it was built in — `nestor` runs fine from a clone with no
      # install at all, so importing in the repo proves nothing about the wheel.
      - name: Install the wheel somewhere else and ask it its version
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "import nestor; print(nestor.__version__)"
          /tmp/verify/bin/nestor --help > /dev/null
          echo "console script resolves"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Tag pushes only. A workflow_dispatch run stops after `build`, which is
    # what makes the dry run safe to hand to anyone.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nestor
    permissions:
      # Trusted Publishing (OIDC). No API token is stored in this repository,
      # so there is no long-lived credential to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
