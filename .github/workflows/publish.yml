name: Publish

# This workflow publishes. It has done so twice — v0.3.0 and v0.3.1 — and the
# comment that used to live here ("nothing can publish today ... there are no
# tags, and `git tag -l` is empty") described a repository that no longer
# exists. Three things must be true for an upload, and the first is the gate:
#
#   1. a `v*` tag must exist, and pushing one is a human act — a session's git
#      credentials carry `refs/heads/*` and refuse `refs/tags/*` (HTTP 403), so
#      an agent can prepare an entire release and still not trigger it;
#   2. the `pypi` environment must exist in repo settings. A *required reviewer*
#      on it is deliberately not used: by the time a tag exists the PR has been
#      reviewed and merged and CI has run, so the prompt would ask the person
#      who pushed the tag to approve their own work. Add one only if a second
#      person should sign off — see docs/releasing.md;
#   3. Trusted Publishing must be configured on PyPI for this repo AND this
#      workflow filename — see docs/releasing.md.
#
# Without a tag, a run builds, checks and stops: `workflow_dispatch` is a dry
# run anybody can trigger, and the publish job is gated on the ref being a tag.

on:
  push:
    tags: ["v*"]
  # A dry run anybody can trigger: builds and checks, never uploads.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag, so the tags must be
          # here. The default shallow checkout fetches none of them, and the
          # build would not fail — it would quietly produce a `0.1.dev…`
          # version and the guard below would reject a tag that is perfectly
          # fine. Both flags: `fetch-depth: 0` alone does not guarantee tags on
          # every checkout action version.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the release toolchain
        run: pip install -e ".[publish]"

      - name: Build
        run: python -m build

      # The gate that matters, and it now runs AFTER the build rather than
      # before it. The version is derived from the tag (hatch-vcs), so there is
      # no longer a pyproject literal to disagree with — the thing that can go
      # wrong is the build not seeing the tag at all, which yields a `.devN`
      # version that is not what was tagged. Reading the built filename catches
      # that; reading pyproject could not, because pyproject no longer says.
      #
      # A version number is the one claim in a release nobody can correct
      # afterwards: PyPI filenames cannot be renamed, reassigned, or deleted and
      # replaced. kartikeya's v0.0.8 built 0.0.7 and only PyPI's duplicate
      # refusal noticed.
      - name: Refuse a tag that disagrees with the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's|.*/nestor_meaning-(.+)\.tar\.gz|\1|')"
          echo "tag=$tag  built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag builds version $built — refusing to publish"
            exit 1
          fi

      - name: Check the metadata PyPI will render
        run: python -m twine check --strict dist/*

      # Proof the artifact imports as itself, from the wheel rather than the
      # source tree it was built in — `nestor` runs fine from a clone with no
      # install at all, so importing in the repo proves nothing about the wheel.
      - name: Install the wheel somewhere else and ask it its version
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "import nestor; print(nestor.__version__)"
          /tmp/verify/bin/nestor --help > /dev/null
          echo "console script resolves"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Tag pushes only. A workflow_dispatch run stops after `build`, which is
    # what makes the dry run safe to hand to anyone.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      # nestor-meaning, not nestor. `nestor` on PyPI is this project's own
      # reserved-and-empty name from before the 0.3.0 rename, and this URL still
      # pointed at it — the same rename fallout decision 0129 recorded for the
      # install hints. Cosmetic (the OIDC claim exchange matches on owner,
      # repository, workflow filename and environment, never on this URL) but it
      # is the link a reviewer follows from the run, and it went to the wrong
      # project. docs/releasing.md quotes this exact string out of the failed
      # v0.2.0 run log.
      url: https://pypi.org/p/nestor-meaning
    permissions:
      # Trusted Publishing (OIDC). No API token is stored in this repository,
      # so there is no long-lived credential to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
