name: Tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — fleet pattern.
    - cron: "57 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: pip install ruff==0.15.0 bandit

      - name: Ruff (enforced)
        run: ruff check nestor tests

      - name: Bandit (enforced — tree is clean, keep it that way)
        run: bandit -r nestor -ll -q

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and current for requires-python >= 3.10.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e . pytest

      # The command the README tells a human to type. It used to be
      # `python -m pytest tests/ -q`, which put the repo root on sys.path where
      # bare `pytest` does not — so CI ran five bench-coverage tests that a
      # developer following the README silently skipped, and the disagreement
      # is what kept it quiet. A gate that runs a different command from the
      # docs is testing something nobody else runs.
      - name: Run tests
        run: pytest -q

  # Aggregate gate: branch protection requires a single check named "test"
  # across the whole fleet. Green only when lint and every matrix leg are.
  test:
    needs: [test-matrix, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and all matrix legs green"
