name: Tests

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — fleet pattern.
    - cron: "57 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: pip install ruff==0.15.0 bandit detect-secrets==1.5.0

      - name: Ruff (enforced)
        run: ruff check nestor tests hooks

      - name: Bandit (enforced — tree is clean, keep it that way)
        run: bandit -r nestor -ll -q

      - name: Secret scan (never commit the trust root)
        # New findings not in .secrets.baseline fail. Derived/binary artifacts
        # carry high-entropy hashes but no source secret, so they are excluded.
        run: |
          git ls-files \
            | grep -vE '(^docs/dogfood/nestor\.db$|^docs/dogfood/decisions\.json$|\.bundle\.json$|^bench/results/)' \
            | xargs detect-secrets-hook --baseline .secrets.baseline

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor and current for requires-python >= 3.10.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        # The [keys] extra rides along so tests/test_asymmetric_seals.py RUNS
        # here rather than import-skipping: a skipped acceptance property
        # reads as covered when it covered nothing (the bureau-differential
        # lesson, applied to crypto). The no-extra refusal path is tested by
        # simulated ImportError, so nothing is lost by installing it.
        run: pip install -e '.[keys]' pytest coverage

      # The command the README tells a human to type. It used to be
      # `python -m pytest tests/ -q`, which put the repo root on sys.path where
      # bare `pytest` does not — so CI ran five bench-coverage tests that a
      # developer following the README silently skipped, and the disagreement
      # is what kept it quiet. A gate that runs a different command from the
      # docs is testing something nobody else runs.
      - name: Run tests (under coverage)
        # `coverage run -m pytest` would put the repo root back on sys.path —
        # the exact divergence the comment above exists to prevent. Script
        # mode keeps bare-pytest semantics (verified: identical 406 tests).
        run: |
          coverage run --include='nestor/*' "$(command -v pytest)" -q
          # Floor, not target: measured 88.4% on master. Ratchet up, never down.
          coverage report --fail-under=85

  # Aggregate gate: branch protection requires a single check named "test"
  # across the whole fleet. Green only when lint and every matrix leg are.
  test:
    needs: [test-matrix, lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and all matrix legs green"
