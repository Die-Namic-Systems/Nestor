name: Tests

# The fleet CI floor (fleet plan decision 5, C4-tests-yml): a Linux job whose
# Python matrix is derived from pyproject.toml's classifiers, a Windows job on
# the floor and ceiling Pythons, a lint job whose ruff is pinned in exactly one
# place, CodeQL, and an aggregate `test` job that fails when any leg is not a
# success. tests/test_ci_floor.py holds each of those facts to the files that
# declare them, with a planted violation per rule.
#
# CodeQL (C4-codeql): this repo runs GitHub's default CodeQL setup, which
# already analyses python, actions and javascript-typescript on every PR (the
# three `Analyze (...)` checks). A codeql.yml in this directory would be
# refused by that setup ("advanced configurations cannot be processed when
# default setup is enabled"), so none is added; the floor's CodeQL leg is the
# default setup, kept as is.

on:
  push:
    # Both names: the fleet is split between `main` and `master`, and a
    # single-name filter turns a default-branch rename into a silently dead
    # push trigger. Same hedge dependabot-automerge.yml already carries.
    branches: [main, master]
  pull_request:
  schedule:
    # Daily drift catcher, off the :00/:30 peak-load minutes — fleet pattern.
    - cron: "57 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        # Upgrade pip/setuptools first: the dependency-vulnerability gate below
        # audits the whole resolved environment (dependencies=[] means the
        # declared set is empty), so a runner shipping a stale, CVE-flagged pip
        # or setuptools would fail the gate on ambient toolchain, not on this
        # project. Upgrading is the honest remediation, and it keeps CI green
        # deterministically rather than at the mercy of the runner image.
        #
        # The versions live in scripts/lint-pins.txt, which scripts/ci-lint.sh
        # checks the local environment against before it runs anything — one
        # file, two callers, neither keeping its own copy (the §6.111 pattern
        # secret-scan.sh and dep-audit.sh already follow, applied to the
        # versions after §6.114 measured what their absence cost: 530 findings
        # locally on a tree CI called clean). The ordering rationale that used
        # to live in this comment — pip-audit before detect-secrets, so the
        # latter's KeywordDetector does not flag the pin line on itself — lives
        # in that file now, next to the order it constrains.
        #
        # The floor asks for ruff pinned to an exact version. It is: `ruff==`
        # appears exactly once in the tree, in scripts/lint-pins.txt, and this
        # file never repeats it (tests/test_ci_floor.py holds both halves).
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r scripts/lint-pins.txt

      - name: Ruff (enforced)
        run: ruff check nestor tests hooks

      - name: Bandit (enforced — tree is clean, keep it that way)
        run: bandit -r nestor -ll -q

      - name: Mypy (enforced — pragmatic baseline, see [tool.mypy] in pyproject.toml)
        run: mypy nestor

      - name: Secret scan (never commit the trust root)
        # Shared with scripts/ci-lint.sh so the exclusion list is defined once
        # and local and CI cannot disagree (agent-log §6.111).
        run: bash scripts/secret-scan.sh

      - name: Dependency vulnerability scan (known CVEs, IDEAS §7.5)
        # Shared with scripts/ci-lint.sh so the invocation and its offline
        # handling are defined once and local and CI cannot disagree
        # (agent-log §6.111 pattern).
        run: bash scripts/dep-audit.sh

  test-matrix:
    runs-on: ubuntu-latest
    # 10 was survivable at 1,641 tests and is not at 1,818. test_unconventional
    # (#180 — 2,779 lines, 177 cases) pushed the suite past it: both legs died at
    # exactly 10m15s having reached 91%, on this branch AND on master, which is
    # why it read as intermittent rather than obvious.
    #
    # NOT coverage. CI runs `coverage run --include='nestor/*'`, so the test
    # file's own hot loops are uninstrumented — measured 10.60s under coverage
    # against 10.47s without, for test_10k_pairs_exact_lookup. The whole stress
    # file is 41s locally; a 2-core runner is simply ~3-4x this hardware.
    #
    # Raised rather than marking the scale tests slow and skipping them on PRs:
    # the 10k-pair lookups are exactly the cases worth running on a change to
    # lookup, and a gate that drops its most informative tests to stay fast is
    # the wrong trade. If this ever needs revisiting, the four TestScale*
    # heavies are ~27s of the file's 41s, and the top two are
    # TestScaleExactMatch::test_10k_pairs_{exact_lookup,absent_probe}.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every minor pyproject.toml declares under
        # `Programming Language :: Python :: 3.X` — the classifiers are the
        # one declaration of what this package supports, and the matrix is
        # held equal to them by tests/test_ci_floor.py rather than kept as a
        # second list by hand (it used to name two of the four). This list
        # stays first in the file: scripts/ci_venv.py reads the first
        # `python-version: [...]` it finds as CI's matrix.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        # The [keys] extra rides along so tests/test_asymmetric_seals.py RUNS
        # here rather than import-skipping: a skipped acceptance property
        # reads as covered when it covered nothing (the bureau-differential
        # lesson, applied to crypto). The no-extra refusal path is tested by
        # simulated ImportError, so nothing is lost by installing it.
        run: pip install -e '.[keys]' pytest pytest-xdist pytest-cov coverage

      # The command the README tells a human to type. It used to be
      # `python -m pytest tests/ -q`, which put the repo root on sys.path where
      # bare `pytest` does not — so CI ran five bench-coverage tests that a
      # developer following the README silently skipped, and the disagreement
      # is what kept it quiet. A gate that runs a different command from the
      # docs is testing something nobody else runs.
      - name: Run tests (under coverage, parallel)
        # pytest-cov + xdist: each worker collects coverage independently;
        # pytest-cov combines them. The pythonpath setting in pyproject.toml
        # ensures the repo root is on sys.path regardless of invocation style.
        run: |
          pytest -n auto --dist loadgroup --cov=nestor --cov-report=term -q
          # Floor, not target: measured 88.4% on master. Ratchet up, never down.
          # pytest-cov writes .coverage; the report reads it.
          coverage report --fail-under=85

  test-windows:
    runs-on: windows-latest
    # The floor's second platform, on the floor and ceiling Pythons only (the
    # first and last classifier minors; tests/test_ci_floor.py holds that).
    # The gate scripts are bash and stay bash: Git Bash is on the Windows
    # runner, so the leg runs the same `bash scripts/ci-test.sh full` AGENTS.md
    # and CONTRIBUTING.md name, not a second command nobody types. Coverage is
    # measured on Linux above; this leg is for the platform, not the number.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (Windows)
        shell: bash
        run: python -m pip install -e '.[keys]' pytest pytest-xdist

      - name: Run the full lane through the bash gate script
        shell: bash
        run: bash scripts/ci-test.sh full

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No npm install — Node's built-in test runner (node:test) needs nothing
      # beyond what ships with Node itself.  The functions under test live in
      # nestor/ui_pure.js with a CommonJS module.exports block at the bottom.
      - name: Run JS unit tests (ui_pure)
        run: node --test 'tests/js/*.js'

  # Aggregate gate: branch protection requires a single check named "test"
  # across the whole fleet. It `needs:` every other job in this file and runs
  # `if: always()` so it reports even when a leg was skipped or cancelled —
  # and then fails on exactly those, explicitly: a `needs:` chain without
  # `always()` is skipped when a leg is skipped, and a skipped required check
  # reads as green to nobody and as "still waiting" to branch protection.
  # `success` is the only result that passes; failure, cancelled and skipped
  # all fail, by name. tests/test_ci_floor.py plants a workflow missing each
  # half and shows the check refuses it.
  test:
    needs: [lint, test-matrix, test-windows, js-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every leg succeeded (failure, cancelled and skipped all fail)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, info in sorted(needs.items()):
              print(f"{job}: {info['result']}")
          bad = {job: info["result"] for job, info in needs.items()
                 if info["result"] != "success"}
          if bad:
              sys.exit(f"not every leg succeeded: {bad}")
          EOF
